<svg viewBox="0 0 1000 466" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — Dellepere Enterprises, UOPCA, Boostify Growth, Simple Studios, Universidad ORT Uruguay">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.3s} .a3{animation-delay:.45s} .a4{animation-delay:.6s} .a5{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  :root { --bone:#000000; --muted:#000000; --dim:#000000; --rule:#000000; --accent:#000000; --node-bg:#FFFFFF; --core-bg:#FFFFFF; --ghost:#000000; --ink:#000000; --paper:#FFFFFF; }
  </style>

  <line x1="120" y1="10" x2="120" y2="456" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42" font-size="11.5" fill="var(--accent)" letter-spacing="1">2022&#8211;now</text>
    <text class="mono" x="136" y="42" font-size="15" fill="var(--bone)">Dellepere Enterprises &#183; Full-Stack Developer &#183; Nov 2022 &#8211; Present</text>
    <text class="mono" x="136" y="68" font-size="14" fill="var(--muted)">built and maintain Aquadelle &#8212; industrial water-purification platform</text>
    <text class="mono" x="136" y="90" font-size="14" fill="var(--muted)">TypeScript / Next.js front end over a PostgreSQL core &#183; treatment runs and plant monitoring</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="138" font-size="11.5" fill="var(--accent)" letter-spacing="1">2024&#8211;25</text>
    <text class="mono" x="136" y="138" font-size="15" fill="var(--bone)">UOPCA &#183; Back-end Developer &#183; Dec 2024 &#8211; Apr 2025</text>
    <text class="mono" x="136" y="164" font-size="14" fill="var(--muted)">designed REST APIs and the database architecture behind them</text>
    <text class="mono" x="136" y="186" font-size="14" fill="var(--muted)">focus on scalable schemas and predictable, well-documented endpoints</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="234" font-size="11.5" fill="var(--accent)" letter-spacing="1">2023&#8211;24</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">Boostify Growth &#183; Software Developer &#183; Dec 2023 &#8211; Jun 2024</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">delivered client-facing web software across front end and back end</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">worked to fixed scopes and deadlines inside a small delivery team</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="330" font-size="11.5" fill="var(--accent)" letter-spacing="1">2020&#8211;24</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">Simple Studios &#183; Founder &amp; Front-end Developer &#183; Mar 2020 &#8211; Jun 2024</text>
    <text class="mono" x="136" y="356" font-size="14" fill="var(--muted)">founded and ran a small studio building websites for local businesses</text>
    <text class="mono" x="136" y="378" font-size="14" fill="var(--muted)">handled the work end to end &#8212; client contact, design, build and deploy</text>
  </g>

  <g class="rise a5">
    <text class="mono" x="48" y="426" font-size="11.5" fill="var(--accent)" letter-spacing="1">2024&#8211;now</text>
    <text class="mono" x="136" y="426" font-size="15" fill="var(--bone)">Universidad ORT Uruguay &#183; Systems Engineering</text>
    <text class="mono" x="136" y="452" font-size="14" fill="var(--muted)">studying alongside full-time development work</text>
  </g>
</svg>