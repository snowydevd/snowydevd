<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gridd — Reel 22 s</title>
<!--
  GRIDD · motion graphics 9:16 para Reels / TikTok
  ─────────────────────────────────────────────────
  · Lienzo 1080×1920, 22 s, pensado a 60 fps. Sin audio.
  · Un solo archivo, sin dependencias: abrilo con doble clic.
  · Todo el dibujo es una función pura del tiempo → render(t). Por eso el replay,
    la pausa y el avance cuadro a cuadro siempre dan exactamente el mismo frame.
  · Las tipografías (Barlow Condensed 600 y 900, licencia SIL OFL 1.1) van
    incrustadas en base64 al final del archivo, en <style id="fonts">.

  Controles:  R = replay · Espacio = pausa · ← → = cuadro a cuadro (Shift ×10)
              G = zonas seguras · B = contador de beats · H = ocultar botones · F = pantalla completa
  Parámetros: ?t=7.0 (arranca pausado en ese segundo) · ?guides=1 · ?hud=1 · ?noui=1
              ?bpm=124 (reubica todos los golpes sobre otro tempo; 120 por defecto)
  Perillas:   buscá GRAIN y GLOW en el código para subir o bajar el grano y el halo del amarillo.
-->
<style>
  :root { --bg:#0B0B0C; --y:#DFFF00; --k3:#1F1F23; --k5:#3C3C43; --k7:#84848E; --k9:#D6D6DA; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { font:500 12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--k7); -webkit-font-smoothing:antialiased; }

  /* escenario: siempre 9:16, lo más grande que entre en la ventana */
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  #box  { position:relative; height:min(100vh, calc(100vw * 16 / 9)); aspect-ratio:9 / 16; }
  @supports (height:100dvh) { #box { height:min(100dvh, calc(100vw * 16 / 9)); } }
  #stage { display:block; width:100%; height:100%; background:var(--bg); }
  body.playing:not(.peek) #box { cursor:none; }

  /* guías de zonas seguras de Reels (tecla G) */
  #guides { position:absolute; inset:0; pointer-events:none; }
  #guides i { position:absolute; left:0; right:0; display:flex; justify-content:center; font-style:normal;
              background:repeating-linear-gradient(135deg, rgba(223,255,0,.16) 0 2px, transparent 2px 12px); }
  #guides .top { top:0; height:15%; align-items:flex-end; border-bottom:1px dashed var(--y); }
  #guides .bot { bottom:0; height:20%; align-items:flex-start; border-top:1px dashed var(--y); }
  #guides b { margin:6px; padding:2px 8px; background:var(--y); color:var(--bg); font-weight:700; letter-spacing:.08em; }

  /* contador de beats (tecla B) */
  #hud { position:fixed; left:12px; top:12px; padding:8px 10px; background:rgba(11,11,12,.86); border:1px solid var(--k5);
         color:var(--k9); white-space:pre; pointer-events:none; }
  #hud b { color:var(--y); }
  #hud.on { border-color:var(--y); }

  /* botones: se esconden solos mientras corre, para que la grabación de pantalla salga limpia */
  #ui { position:fixed; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center;
        justify-content:center; flex-wrap:wrap; padding:0 16px; transition:opacity .18s ease; }
  body.playing:not(.peek) #ui, body.noui #ui { opacity:0; pointer-events:none; }
  button { all:unset; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px 0 14px; border-radius:20px; cursor:pointer;
           font:700 13px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.06em; text-transform:uppercase;
           background:var(--y); color:var(--bg); }
  button:hover { filter:brightness(1.06); }
  button:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--k9); outline-offset:3px; }
  button.ghost { background:rgba(11,11,12,.86); color:var(--k9); box-shadow:inset 0 0 0 1px var(--k5); }
  button.ghost:hover { box-shadow:inset 0 0 0 1px var(--y); }
  button svg { width:16px; height:16px; }
  #keys { flex-basis:100%; text-align:center; opacity:.9; text-shadow:0 0 6px var(--bg), 0 0 6px var(--bg); }
  #recdot { position:fixed; right:12px; top:12px; padding:6px 10px; color:var(--bg); background:var(--y); font-weight:700; letter-spacing:.08em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<div id="wrap"><div id="box">
  <canvas id="stage" width="1080" height="1920" role="img"
          aria-label="Animación de Gridd: el caos de grupos, stories y flyers se ordena en una grilla de car meets de Uruguay."></canvas>
  <div id="guides" hidden><i class="top"><b>NO SEGURO · 15%</b></i><i class="bot"><b>NO SEGURO · 20%</b></i></div>
</div></div>

<div id="hud" hidden></div>
<div id="recdot" hidden>● GRABANDO</div>

<div id="ui">
  <button id="replay" type="button" title="Volver a reproducir (R)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.6 1.8v2.9h-2.9"/></svg>
    Replay
  </button>
  <button id="rec" type="button" class="ghost" title="Graba el lienzo a 1080×1920 mientras se reproduce y descarga el archivo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg>
    Grabar video
  </button>
  <span id="keys">R replay · Espacio pausa · ← → cuadro a cuadro · G zonas seguras · B beats · H ocultar · F pantalla completa</span>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════════════════════════════════
   1 · FORMATO Y MAPA DE SINCRONÍA
   ──────────────────────────────────────────────────────────────────────────────────────
   Todo el timing cae sobre una grilla de 120 BPM (negra = 0,5 s = 30 frames; compás 4/4 = 2 s).
   Si la música tiene otro tempo, abrí el archivo con ?bpm=124 (o cambiá BPM acá abajo): los golpes
   se reubican solos sobre la nueva grilla. La duración total son 44 negras: 22 s a 120 BPM,
   21,3 s a 124, 20,6 s a 128. Los tiempos de esta tabla son los de 120 BPM.

   Buscá «[SYNC]» en el código para saltar a cada golpe.  ★ = acento fuerte   ● = acento

     seg     frame  comp.tiempo   qué pasa                                      idea de audio
     0.00       0   1.1           negro + grano                                 aire / silencio
     0.10       6   —             se encienden los focos (parpadeo)             clic / zumbido eléctrico
     0.50      30   1.2         ● «¿DÓNDE ES»                                   primer golpe
     0.75      45   1.2+          «LA JUNTADA»
     1.00      60   1.3           «ESTE FINDE?»
     1.50      90   1.4         ● bloque amarillo sobre «ESTE FINDE?»           acento
     2.79     167   —             salida seca del hook                          corte
     3.00     180   2.3         ● placa «GRUPOS DE WHATSAPP.» + 1.ª burbuja     entra la base / notificaciones
     4.00     240   3.1         ● placa «STORIES QUE VUELAN.»
     5.00     300   3.3         ● placa «FLYERS PERDIDOS.»
     6.00     360   4.1           riser: el caos tiembla y hace zoom (1 s)      riser / redoble
     6.80     408   —             anticipación: todo se contrae                 vacío de 1/8 antes del golpe
     7.00     420   4.3         ★ SNAP: golpe seco + flash amarillo             golpe principal + corte
     7.50     450   4.4           tick: las tarjetas se «chequean» una a una
     8.00     480   5.1         ● las tarjetas se funden en el celular          entra el groove
     8.50     510   5.2           se enciende la pantalla
     9.00     540   5.3         ● placa «TODOS LOS MEETS. UN SOLO LUGAR.»       tarjetas en corcheas:
                                  + tarjetas en 9.00 / 9.25 / 9.50 / 9.75 / 10.00   hi-hat
    10.25     615   6.1+          scroll del feed
    11.00     660   6.3         ● placa «ENCONTRÁ LOS DE TU ZONA.» + mapa
    11.25…12.50                   un pin por corchea (6 pines)                  ticks / hi-hat
    12.50     750   7.2         ● radio «TU ZONA»
    13.00     780   7.3         ● placa «¿ORGANIZÁS? PUBLICÁ EL TUYO.»
    14.00     840   8.1         ● tap en PUBLICAR
    14.50     870   8.2         ● cae el pin nuevo
    15.00     900   8.3         ● el celular colapsa en una línea               corte / sub drop
    15.30     918   —             entra el auto                                 whoosh de entrada
    16.00     960   9.1           auto en el centro (travelling)                motor / rumble
    16.50     990   9.2           sale el auto, queda la estela                 whoosh de salida
    17.00    1020   9.3         ★ la estela queda vertical: es la barra «|»     golpe
    17.50    1050   9.4           la grilla renace desde la barra
    18.00    1080   10.1        ★ salen «GR» y «DD» de atrás de la barra        golpe final / acorde
    18.50    1110   10.2        ● «SUMATE A LA BETA»
    19.00    1140   10.3          se tipea «gridd.app»
    19.50    1170   10.4          todo quieto hasta el final (2,5 s de lectura) cola del acorde
    22.00    1320   12.1          fin
   ══════════════════════════════════════════════════════════════════════════════════════ */
const W = 1080, H = 1920, FPS = 60, DT = 1 / FPS;
const qs = new URLSearchParams(location.search);
const BPM = Math.min(140, Math.max(100, parseFloat(qs.get('bpm')) || 120));   // ?bpm=124 para calzar con otro tema (120–132 → 22–20 s)
const BEAT = 60 / BPM, H8 = BEAT / 2;          // negra y corchea, en segundos
const b = n => n * BEAT;                       // negra n (desde 0) → segundos

const T = {
  // 1 · HOOK
  LIGHTS: 0.10,                                // se encienden los focos
  HOOK_L1: b(1), HOOK_L2: b(1.5), HOOK_L3: b(2), HOOK_HIT: b(3), HOOK_OUT: b(6) - 0.21,
  // 2 · PROBLEMA
  CHAOS: b(6), P1: b(6), P2: b(8), P3: b(10), RISER: b(12), ANTIC: b(14) - 0.20, RUSH: b(14) - 5 / FPS,
  // 3 · SNAP
  SNAP: b(14), TICK: b(15), MERGE: b(16), UI_ON: b(17),
  // 4 · PRODUCTO
  PROD: b(18), SCROLL: b(20.5), MAP: b(22), ZONE: b(25), PUB: b(26), SEND: b(28), NEWPIN: b(29),
  // 5 · TRANSICIÓN
  CAR: b(30), CAR_IN: b(30) + 0.30, CAR_MID: b(32), CAR_OUT: b(33), BAR: b(34), REGRID: b(35),
  // 6 · CIERRE
  LOGO: b(36), CTA: b(37), URL: b(38), STILL: b(39), END: b(44),
};
const DUR = T.END;

/* Reels: nada importante en el 15% de arriba ni en el 20% de abajo.
   La grilla base es de 120 px con origen en (60,60): el área de contenido queda en
   x 60→1020 (8 columnas) · y 300→1500 (10 filas), adentro de la zona segura (288→1536). */
const GC = 120, GO = 60;

/* ══════════ 2 · PALETA (estricta: negro, amarillo flúo y grises intermedios) ══════════ */
const BG = '#0B0B0C', YEL = '#DFFF00';
const yel = a => `rgba(223,255,0,${a})`;
const K = { k2: '#17171A', k3: '#1F1F23', k4: '#2B2B30', k5: '#3C3C43', k6: '#5A5A63', k7: '#84848E', k8: '#ADADB6', k9: '#D6D6DA' };

/* ══════════ 3 · UTILIDADES ══════════ */
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const clamp = (v, a = 0, c = 1) => v < a ? a : v > c ? c : v;
const lerp = (a, c, u) => a + (c - a) * u;
const prog = (t, a, c) => clamp((t - a) / (c - a));          // avance 0→1 entre a y c

/* Easing con carácter: entradas rápidas con overshoot (outBack), salidas secas (inCubic/inQuart). Nada lineal. */
const E = {
  inQuad: x => x * x,
  inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inQuart: x => x * x * x * x, outQuart: x => 1 - Math.pow(1 - x, 4),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); };
const jit = (id, t, amp, hz = 15) => (hash(id * 13.37 + Math.floor(t * hz) * 7.13) * 2 - 1) * amp;   // temblor «en doses»
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d'), w, h }; };
function rr(c, x, y, w, h, r) {                      // rectángulo redondeado (path)
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function smooth(c, pts) {                            // curva suave por una lista de puntos
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  c.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}

/* ── tipografía ── */
const FAM = '"Barlow Condensed","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif';
const FD = s => `900 ${s}px ${FAM}`;                 // display: grotesca bold condensada
const FU = (s, w = 600) => `${w} ${s}px ${FAM}`;     // interfaz / textos chicos
const M = mk(4, 4).x;                                // contexto sólo para medir
const _tw = new Map(), _lay = new Map();
function tw(str, font) { const k = font + '|' + str; let v = _tw.get(k); if (v === undefined) { M.font = font; v = M.measureText(str).width; _tw.set(k, v); } return v; }
function lay(str, font) {                            // posición de cada letra respetando el kerning de la fuente
  const k = font + '|' + str; let L = _lay.get(k);
  if (!L) { const g = []; let prev = 0, wi = 0; for (let i = 0; i < str.length; i++) { const w = tw(str.slice(0, i + 1), font); if (str[i] === ' ') wi++; g.push({ ch: str[i], x: prev, w: w - prev, wi }); prev = w; } L = { g, w: prev }; _lay.set(k, L); }
  return L;
}
function tracked(c, str, x, y, tr, align = 'left') {  // texto con tracking manual (no depende de ctx.letterSpacing)
  const L = lay(str, c.font), w = L.w + tr * (str.length - 1);
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const ta = c.textAlign; c.textAlign = 'left';
  for (let i = 0; i < L.g.length; i++) c.fillText(L.g[i].ch, x0 + L.g[i].x + tr * i, y);
  c.textAlign = ta; return w;
}
let CAP = 0.7;                                       // altura de mayúscula / cuerpo (se mide al iniciar)

/* ══════════ 4 · LIENZOS ══════════ */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
const HB = mk(270, 480), HB2 = mk(270, 480);         // haces de luz: a un cuarto de resolución (son difusos, no se nota)
const B1 = mk(540, 960), B2 = mk(270, 480), G2 = mk(270, 480), B3 = mk(135, 240), B4 = mk(68, 120), B5 = mk(34, 60),
      U4 = mk(68, 120), U3 = mk(135, 240), U2 = mk(270, 480);   // pirámide del glow
const A = {};                                        // sprites pre-renderizados

/* ══════════ 5 · GRILLA ══════════
   Dos capas: líneas principales (se mueven con la cámara) e intermedias (se mueven menos → parallax sutil). */
function drawGrid(c, o) {
  const ox = o.ox || 0, oy = o.oy || 0, fox = o.fox || 0, foy = o.foy || 0;
  const maj = o.maj ?? 0.2, min = o.min ?? 0.06, cross = o.cross ?? 0.3, va = o.va ?? 1, g = o.grow;   // va: alpha extra de las verticales
  const a0 = c.globalAlpha;
  c.fillStyle = YEL;
  if (min > 0.004) {
    const mx = ((fox % GC) + GC) % GC, my = ((foy % GC) + GC) % GC;
    c.globalAlpha = a0 * min * va;
    if (va > 0.01) for (let x = mx - GC; x <= W + GC; x += GC) c.fillRect(x - 0.75, -200, 1.5, H + 400);
    c.globalAlpha = a0 * min;
    for (let y = my - GC; y <= H + GC; y += GC) c.fillRect(-200, y - 0.75, W + 400, 1.5);
  }
  if (maj <= 0.004) { c.globalAlpha = a0; return; }
  const sx = (((GO + ox) % GC) + GC) % GC - GC, sy = (((GO + oy) % GC) + GC) % GC - GC;
  const grow = (d) => g ? E.outCubic(prog(g.t, g.t0 + d / GC * 0.04, g.t0 + d / GC * 0.04 + 0.42)) : 1;
  c.globalAlpha = a0 * maj * va;
  if (va > 0.01) for (let x = sx; x <= W + GC; x += GC) {
    const p = grow(Math.abs(x - (g ? g.cx : 0))); if (p <= 0) continue;
    if (g) { const y0 = g.cy - p * (g.cy + 200), y1 = g.cy + p * (H - g.cy + 200); c.fillRect(x - 1, y0, 2, y1 - y0); }
    else c.fillRect(x - 1, -200, 2, H + 400);
  }
  c.globalAlpha = a0 * maj;
  for (let y = sy; y <= H + GC; y += GC) {
    const p = grow(Math.abs(y - (g ? g.cy : 0))); if (p <= 0) continue;
    if (g) { const x0 = g.cx - p * (g.cx + 200), x1 = g.cx + p * (W - g.cx + 200); c.fillRect(x0, y - 1, x1 - x0, 2); }
    else c.fillRect(-200, y - 1, W + 400, 2);
  }
  if (cross > 0.01 && va > 0.02) {                    // cruces en cada intersección
    for (let x = sx; x <= W + GC; x += GC) for (let y = sy; y <= H + GC; y += GC) {
      const p = g ? Math.min(grow(Math.abs(x - g.cx)), grow(Math.abs(y - g.cy))) : 1; if (p < 0.6) continue;
      c.globalAlpha = a0 * cross * va * (g ? (p - 0.6) / 0.4 : 1);
      c.fillRect(x - 8, y - 1, 16, 2); c.fillRect(x - 1, y - 8, 2, 16);
    }
  }
  c.globalAlpha = a0;
}

/* Haces de luz con bordes suaves: degradé radial (distancia) × degradé cónico (ángulo), a 1/4 de resolución.
   Se mezclan con alpha normal (no aditivo) para que el punto más brillante nunca pase de #DFFF00.
   list = [[ox, oy, ángulo, semiapertura, largo], …] */
const HAS_CONIC = typeof ctx.createConicGradient === 'function';
function softBeams(c, list, alpha) {
  if (alpha <= 0.004) return;
  if (!HAS_CONIC) {                                  // navegadores viejos: conos simples
    for (const [ox, oy, ang, half, len] of list) { const g = c.createRadialGradient(ox, oy, 0, ox, oy, len); g.addColorStop(0, yel(alpha)); g.addColorStop(1, yel(0)); c.fillStyle = g; c.beginPath(); c.moveTo(ox, oy); c.arc(ox, oy, len, ang - half * 0.6, ang + half * 0.6); c.closePath(); c.fill(); }
    return;
  }
  const acc = HB2.x; acc.setTransform(1, 0, 0, 1, 0, 0); acc.globalCompositeOperation = 'source-over'; acc.clearRect(0, 0, 270, 480); acc.globalCompositeOperation = 'lighter';
  const k = a => `rgba(0,0,0,${a})`;
  for (const [ox, oy, ang, half, len] of list) {
    const x = HB.x; x.setTransform(0.25, 0, 0, 0.25, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H);
    const rg = x.createRadialGradient(ox, oy, 0, ox, oy, len);
    rg.addColorStop(0, yel(1)); rg.addColorStop(0.3, yel(0.7)); rg.addColorStop(0.65, yel(0.3)); rg.addColorStop(1, yel(0));
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'destination-in';
    const cg = x.createConicGradient(ang - Math.PI, ox, oy), hw = half / TAU;
    cg.addColorStop(0, k(0)); cg.addColorStop(0.5 - hw, k(0)); cg.addColorStop(0.5 - hw * 0.55, k(0.32)); cg.addColorStop(0.5 - hw * 0.22, k(0.85));
    cg.addColorStop(0.5, k(1)); cg.addColorStop(0.5 + hw * 0.22, k(0.85)); cg.addColorStop(0.5 + hw * 0.55, k(0.32)); cg.addColorStop(0.5 + hw, k(0)); cg.addColorStop(1, k(0));
    x.fillStyle = cg; x.fillRect(0, 0, W, H);
    acc.drawImage(HB.c, 0, 0);
  }
  const a0 = c.globalAlpha; c.globalAlpha = a0 * alpha; c.drawImage(HB2.c, 0, 0, W, H); c.globalAlpha = a0;
}

/* ══════════ 6 · KINETIC TYPOGRAPHY ══════════
   Texto que sube desde una máscara, por letra o por palabra, con overshoot al llegar y caída seca al salir. */
function riseText(c, str, x, base, size, color, t, tIn, tOut, o = {}) {
  const pre = o.pre ?? 0.09;                           // arranca un poco antes para que el «golpe» caiga en el beat
  if (t < tIn - pre || (tOut !== undefined && t > tOut + 0.3)) return;
  const font = FD(size), L = lay(str, font), byWord = !!o.byWord;

/* ══════════ 7 · CÁMARA ══════════

function camera(t) {
  const still = 1 - E.inOutCubic(prog(t, T.LOGO + 0.4, T.STILL));
  const x = 9 * Math.sin(t * 0.45 + 1.1) * still, y = 12 * Math.sin(t * 0.33 + 0.4) * still;

/* ══════════════════════════════════════════════════════════════════════════════════════
   ESCENA 1 · HOOK  (0–3 s)
   Negro → dos haces de focos barren la pantalla → a su paso queda dibujada la grilla.
   ══════════════════════════════════════════════════════════════════════════════════════ */
const HK = { px: -240, py: 2140, a0: -90 * RAD, a1: 14 * RAD };            // pivote del «auto» fuera de cuadro, abajo a la izquierda

  const d = t - T.LIGHTS; if (d < 0) return 0;
  return d < 0.034 ? 1 : d < 0.075 ? 0.15 : d < 0.11 ? 0.9 : d < 0.135 ? 0.35 : 1;
}
const HOOK = { x: 60, size: 171, lines: [
  { s: '¿DÓNDE ES',   base: 780,  t: T.HOOK_L1 },     // [SYNC 0.50]
  { s: 'LA JUNTADA',  base: 960,  t: T.HOOK_L2 },     // [SYNC 0.75]
  { s: 'ESTE FINDE?', base: 1140, t: T.HOOK_L3 },     // [SYNC 1.00]
] };
const DUST = (() => { const R = rng(7); return Array.from({ length: 110 }, () => ({ x: R() * W, y: R() * H, z: 0.4 + R() * 0.9, ph: R() * TAU, s: 1.5 + R() * 2.8 })); })();

function gridReveal(c, t, cam) {                      // la grilla sólo existe donde ya pasó la luz
  const I = HAS_CONIC ? headI(t) : prog(t, 0.2, 1.4); if (I <= 0) return;
  const th = hookAngle(t), lead = 5 * RAD, decay = 30 * RAD, rest = 0.33, px = HK.px + cam.x, py = HK.py + cam.y;
  const mask = (x, y) => {                              // 0 adelante del haz · 1 en el haz · «rest» donde ya pasó
    let d = Math.atan2(y - py, x - px) - th - lead; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
    if (d >= 0) return 0; d = -d; return d < lead ? d / lead : d < lead + decay ? lerp(1, rest, (d - lead) / decay) : rest;
  };

    for (let x = ox; x <= W + GC; x += GC) for (let y = -40; y < H + 40; y += SEG) { const m = mask(x, y + SEG / 2); if (m > 0) { c.globalAlpha = a0 * base * m * I; c.fillRect(x - w / 2, y, w, SEG); } }

  };

  const sx = wrap(GO + cam.x), sy = wrap(GO + cam.y); lines(sx, sy, 0.62, 2);

function sceneHook(c, t, cam) {
  const I = headI(t);
  if (I > 0 && t < 1.95) {
    const th = hookAngle(t), fade = 1 - prog(t, 1.5, 1.9);
    const org = [-1, 1].map(s => [HK.px + cam.x + Math.cos(th) * 180 - Math.sin(th) * 170 * s, HK.py + cam.y + Math.sin(th) * 180 + Math.cos(th) * 170 * s]);
    c.save(); c.setTransform(1, 0, 0, 1, cam.sx, cam.sy);
    softBeams(c, org.map(([ox, oy]) => [ox, oy, th, 9.5 * RAD, 3100]), 0.5 * I * fade);
    // polvo en suspensión: sólo se ve cuando lo atraviesa un haz
    c.fillStyle = YEL;
    for (const p of DUST) {
      const px = p.x + Math.sin(t * 0.7 + p.ph) * 14 + cam.x * 1.6, py = ((p.y - t * 16 * p.z) % H + H) % H + cam.y * 1.6;

  if (t > T.HOOK_L3 + 0.2 && t < T.CHAOS) {
    c.fillStyle = YEL;
    for (let k = 0; k < 13; k++) {
      const tk = T.HOOK_L3 + H8 + k * H8 / 2; if (t < tk || t > tk + 0.36) continue;
      const col = Math.floor(hash(k * 3.3 + 1) * 8), row = 2 + Math.floor(hash(k * 7.7 + 2) * 10);

  if (la > 0) { c.globalAlpha = la; c.font = FU(21, 600); c.fillStyle = K.k6; tracked(c, '34°53′S  56°11′O', 68, 329, 2.2); tracked(c, 'UY — MVD / CAN', 1012, 1487, 2.2, 'right'); c.globalAlpha = 1; }

  const S = HOOK.size, cap = S * CAP, L3 = HOOK.lines[2];
  for (let i = 0; i < 2; i++) riseText(c, HOOK.lines[i].s, HOOK.x, HOOK.lines[i].base, S, K.k9, t, HOOK.lines[i].t, T.HOOK_OUT + i * 0.02);

const STK = { size: 150 };                                   // cuerpo de las placas tipo sticker (se ajusta al iniciar)

      const len = sp * s.z * 0.05 + 10, span = W + len + 240, x = W + 120 - (((s.x * span + sc * s.z) % span) + span) % span;
      c.globalAlpha = (s.yel ? 0.6 : 0.45) * spk * (0.35 + 0.65 * (s.z - 0.35) / 1.15);
      c.fillStyle = s.yel ? YEL : K.k6; c.fillRect(x, s.y + cam.y * 1.6, len, s.w);
    }
    c.globalAlpha = 1;
  }
  const carOn = t >= T.CAR_IN - 0.3 && tail < W + 80, nose = tail + (CAR.noseX - 16) * CS;
  // piso
  const road = prog(t, T.CAR + 0.1, T.CAR + 0.4) * (1 - prog(t, T.CAR_OUT + 0.02, T.CAR_OUT + 0.3));
  if (road > 0) { c.globalAlpha = road; c.fillStyle = K.k4; c.fillRect(-60, GY, W + 120, 2); c.globalAlpha = 1; }
  if (carOn) {                                              // la luz llega antes que el auto
    c.save(); c.setTransform(1, 0, 0, 1, cam.sx, cam.sy);
    softBeams(c, [[nose + cam.x, GY + CAR.noseY * CS + cam.y, 0.04, 11 * RAD, 1500]], 0.62 * E.inQuad(prog(t, T.CAR_IN - 0.3, T.CAR_IN + 0.02)));
    c.restore();
    // reflejos en el asfalto: charcos de luz chatos bajo cada faro
    const pool = (x, rx, ry, a) => { c.save(); c.translate(x, GY + ry * 0.7); c.scale(1, ry / rx); const g = c.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, yel(a)); g.addColorStop(1, yel(0)); c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore(); };
    pool(tail - 30, 130, 9, 0.55); pool(nose + 150, 260, 11, 0.5);
  }
  // estela
  if (t < T.BAR - 0.28) {
    const S = trailState(t), uni = prog(t, T.CAR_OUT, T.CAR_OUT + 0.2);
    const xR = Math.min(tail + 10, lerp(W + 60, 540 + S.half, S.con)), xL = lerp(-60, 540 - S.half, S.con);
    const amp = 8 * (1 - E.outCubic(prog(t, T.CAR_OUT, T.CAR_OUT + 0.22)));              // «se endereza»: primero se le va la onda
    if (xR > xL) {
      c.strokeStyle = YEL; c.lineCap = 'round';
      const yAt = x => 780 + amp * clamp((xR - x) / 520) * Math.sin((x + sc) * 0.019 + 1.3);
      for (let x = xR; x > xL; x -= 26) {
        const x2 = Math.max(xL, x - 26), k = clamp((xR - x) / 620);
        c.lineWidth = lerp(lerp(19, 8, k), S.thick, uni); c.beginPath(); c.moveTo(x, yAt(x)); c.lineTo(x2, yAt(x2)); c.stroke();
      }
      const gx = Math.min(tail, W + 60);                      // la estela también se refleja en el piso
      if (gx > xL && road > 0) { const g = c.createLinearGradient(xL, 0, gx, 0); g.addColorStop(0, yel(0.1 * road)); g.addColorStop(1, yel(0.34 * road)); c.fillStyle = g; c.fillRect(xL, GY + 3, gx - xL, 3); }
    }
  } else drawBar(c, t);
  // auto
  if (carOn && tail > -1150) {
    const vx = (carTailX(t) - carTailX(t - DT)) / DT, fast = Math.abs(vx) > 900;
    const one = (tt, a) => {
      const tx = carTailX(tt), bob = 2.2 * Math.sin(tt * 11);
      c.save(); c.globalAlpha = a; c.translate(tx - 16 * CS, GY);
      c.save(); c.scale(CS, CS); const ang = (SCR(tt) + tx) / 72; drawWheel(c, 132, -50, ang, sp + Math.abs(vx)); drawWheel(c, 524, -50, ang, sp + Math.abs(vx)); c.restore();
      c.drawImage(A.car.c, -A.car.ox, -A.car.oy + bob);
      c.restore();
    };
    if (fast) {                                               // motion blur: ecos de la masa del auto + barrido de los faros
      for (let g = 12; g >= 1; g--) { c.globalAlpha = 0.11; c.drawImage(A.carSoft.c, carTailX(t - g * DT * 0.13) - 16 * CS - A.car.ox, GY - A.car.oy); }
      const len = Math.abs(vx) * DT * 1.4, lg = c.createLinearGradient(nose - len, 0, nose, 0); lg.addColorStop(0, yel(0)); lg.addColorStop(1, yel(0.8));
      c.globalAlpha = 1; c.fillStyle = lg; c.fillRect(nose - len, GY + (CAR.noseY - 12) * CS, len, 22 * CS);
    }
    one(t, 1);
  }
  // [SYNC 17.00] la barra clava: línea central de punta a punta + halo
  if (t >= T.BAR && t < T.BAR + 0.7) {
    const d = t - T.BAR; c.fillStyle = YEL;
    c.globalAlpha = 0.9 * Math.exp(-d * 6.5); c.fillRect(540 - 1.5, -200, 3, H + 400);
    const g = c.createRadialGradient(540, 780, 0, 540, 780, 520); g.addColorStop(0, yel(0.3 * Math.exp(-d * 7))); g.addColorStop(1, yel(0));
    c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 200, W, 1200);
  }
}

/* ══════════════════════════════════════════════════════════════════════════════════════
   ESCENA 6 · CIERRE  (18–22 s)
   La barra queda en el centro, las letras salen de atrás y arman GR|DD. Después, quieto.
   ══════════════════════════════════════════════════════════════════════════════════════ */
const CTA = { y: 960, h: 116, size: 90, txt: 'SUMATE A LA BETA' }, URLT = 'gridd.app';
function sceneOutro(c, t) {
  const g = WM, base = 900, t0 = T.LOGO - 0.13;                                          // [SYNC 18.00] salen 0,13 s antes: llegan justo en el golpe
  const travel = -g.inkL - g.bw / 2 + 40;
  const eIn = tt => E.outBack(prog(tt, t0, t0 + 0.38), 1.35), eOut = tt => E.outBack(prog(tt, t0, t0 + 0.38), 2.5);   // la de afuera rebota más: se abren como un acordeón
  c.font = g.font; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = K.k9;
  const side = (sgn, tt, a) => {
    const dI = (1 - eIn(tt)) * travel, dO = (1 - eOut(tt)) * travel;
    c.globalAlpha = a;
    if (sgn < 0) { c.fillText('R', 540 + g.rX + dI, base); c.fillText('G', 540 + g.grX + dO, base); }
    else { c.fillText('D', 540 + g.ddX - dI, base); c.fillText('D', 540 + g.d2X - dO, base); }
  };
  if (t >= t0) for (const sgn of [-1, 1]) {
    c.save(); c.beginPath();
    if (sgn < 0) c.rect(-300, 500, 540 - g.bw / 2 + 300, 600); else c.rect(540 + g.bw / 2, 500, 900, 600);   // máscara: salen de atrás de la barra
    c.clip();
    if (t < t0 + 0.2) for (let k = 3; k >= 1; k--) side(sgn, t - k * DT * 0.4, 0.2);     // smear
    side(sgn, t, 1); c.restore();
  }
  c.globalAlpha = 1;

  // [SYNC 18.50] CTA: bloque amarillo del ancho exacto del wordmark
  const x0 = 540 + g.inkL, x1 = 540 + g.inkR, bw = x1 - x0, cp = E.outBack(prog(t, T.CTA - 0.07, T.CTA + 0.2), 1.25);
  if (cp > 0) {
    c.fillStyle = YEL; c.fillRect(540 - bw / 2 * cp, CTA.y, bw * cp, CTA.h);
    const S = CTA.size, w = tw(CTA.txt, FD(S));
    ink(c, () => { c.save(); c.beginPath(); c.rect(540 - bw / 2 * cp, CTA.y, bw * cp, CTA.h); c.clip();
      riseText(c, CTA.txt, 540 - w / 2, CTA.y + CTA.h / 2 + S * CAP / 2, S, BG, t, T.CTA + 0.07, undefined, { byWord: true, stg: 0.05, dur: 0.26, back: 1.3 }); c.restore(); });
  }
  // [SYNC 19.00] URL tipeada
  const n = Math.floor(prog(t, T.URL - 0.02, T.URL + 0.3) * URLT.length + 0.001);
  if (t >= T.URL - 0.02) {
    c.font = FU(72); c.textBaseline = 'alphabetic'; c.fillStyle = K.k9;
    const tr = 3, full = tw(URLT, c.font) + tr * (URLT.length - 1), sx = 540 - full / 2, s = URLT.slice(0, n);
    const w = n ? tracked(c, s, sx, 1192, tr) : 0;
    if (t < T.STILL - 0.1 && (n < URLT.length || Math.floor((t - T.URL) * 6) % 2 === 0)) { c.fillStyle = YEL; c.fillRect(sx + w + 6, 1192 - 52, 6, 56); }   // cursor; se apaga antes del quieto
  }
}

/* ══════════ 8 · FONDO: la grilla según el momento ══════════ */
function bgGrid(c, t, cam) {
  const far = { fox: cam.x * 0.35, foy: cam.y * 0.35 };
  if (t < T.LIGHTS) return;
  if (t < 1.75) return gridReveal(c, t, cam);
  let o = { ox: cam.x, oy: cam.y, ...far, maj: 0.205, min: 0.066, cross: 0.33 };
  if (t < T.CHAOS) { const pu = t >= T.HOOK_HIT ? Math.exp(-(t - T.HOOK_HIT) * 9) : 0; o.maj += 0.3 * pu; o.cross += 0.5 * pu; }
  else if (t < T.SNAP) {                                    // caos: la grilla se apaga y tiembla
    const d = E.outCubic(prog(t, T.CHAOS, T.CHAOS + 0.5)), fl = 0.7 + 0.3 * hash(Math.floor(t * 20) * 1.7), a = lerp(1, 6, prog(t, T.CHAOS, T.ANTIC)) * (1 - prog(t, T.ANTIC, T.RUSH));
    o.maj = lerp(0.205, 0.075, d) * fl; o.min = lerp(0.066, 0.022, d); o.cross = lerp(0.33, 0.1, d) * fl; o.ox += jit(901, t, a); o.oy += jit(902, t, a);
  } else if (t < T.PROD) {                                  // [SYNC 7.00] la grilla manda: se enciende entera y decae
    const k = Math.exp(-(t - T.SNAP) * 3.2), tk = t >= T.TICK ? Math.exp(-(t - T.TICK) * 10) : 0;
    o.maj = 0.16 + 0.78 * k + 0.1 * tk; o.min = 0.05 + 0.2 * k; o.cross = 0.28 + 0.72 * k + 0.2 * tk;
  } else if (t < T.CAR) { o.maj = 0.16; o.min = 0.05; o.cross = 0.28; }
  else if (t < T.BAR + 0.25) {                              // paneo: horizontales nítidas, verticales barridas por la velocidad
    const sp = speed(t), sc = SCR(t), f = 1 - E.inOutCubic(prog(t, T.CAR_OUT - 0.05, T.BAR - 0.1));
    o.ox = cam.x - sc * 0.55; o.fox = far.fox - sc * 0.3; o.va = clamp(1 - sp / 500); o.maj = 0.16 * f; o.min = 0.05 * f; o.cross = 0.28 * f;
  } else {                                                  // [SYNC 17.50] la grilla renace desde la barra
    o.maj = 0.16; o.cross = 0.28; o.min = 0.05 * prog(t, T.REGRID + 0.1, T.LOGO); o.grow = { cx: 540 + cam.x, cy: 780 + cam.y, t0: T.REGRID - 0.25, t };
  }
  drawGrid(c, o);
}

/* ══════════ 9 · POST: flash, glow, viñeta y grano ══════════ */
function buildPost() {
  const v = mk(W, H), g = v.x.createRadialGradient(W / 2, H * 0.475, H * 0.23, W / 2, H * 0.475, H * 0.69);
  g.addColorStop(0, 'rgba(11,11,12,0)'); g.addColorStop(1, 'rgba(11,11,12,0.66)'); v.x.fillStyle = g; v.x.fillRect(0, 0, W, H); A.vig = v;
  A.grain = [0, 1, 2].map(k => {                            // tres baldosas de ruido que se alternan (grano de ~2 px)
    const n = mk(256, 256), id = n.x.createImageData(256, 256), R = rng(1000 + k);
    for (let i = 0; i < id.data.length; i += 4) { const r = R(); if (r < 0.5) { id.data[i] = 214; id.data[i + 1] = 214; id.data[i + 2] = 218; id.data[i + 3] = (0.5 - r) * 2 * GRAIN.light; } else { id.data[i] = 11; id.data[i + 1] = 11; id.data[i + 2] = 12; id.data[i + 3] = (r - 0.5) * 2 * GRAIN.dark; } }
    n.x.putImageData(id, 0, 0);
    const s = mk(512, 512); s.x.drawImage(n.c, 0, 0, 512, 512); return ctx.createPattern(s.c, 'repeat');
  });
}
const GRAIN = { light: 17, dark: 24 };                      // intensidad del grano (alpha 0–255). Subilo o bajalo a gusto.
const GLOW = 0.55;                                          // intensidad del glow del amarillo
function post(c, t, grainT) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over';
  // [SYNC 7.00] flash amarillo: un frame lleno y decae seco
  if (t >= T.SNAP) { const a = Math.exp(-(t - T.SNAP) * 30); if (a > 0.004) { c.globalAlpha = a; c.fillStyle = YEL; c.fillRect(0, 0, W, H); } }
  c.globalAlpha = 1;

  /* Glow suave SÓLO en el amarillo, sin correr el tono:
     1) se reduce el frame · 2) se le resta su versión en grises (lo neutro queda en negro) y al resto se le
     devuelve el tono #DFFF00 · 3) se desenfoca bajando y subiendo de tamaño · 4) se mezcla con «lighten»,
     que nunca deja pasar un píxel más allá del amarillo de marca. Todo en buffers chicos: una sola pasada a pantalla. */
  let x = B1.x; x.globalCompositeOperation = 'copy'; x.drawImage(cv, 0, 0, 540, 960);
  x = B2.x; x.globalCompositeOperation = 'copy'; x.drawImage(B1.c, 0, 0, 270, 480);
  x = G2.x; x.globalCompositeOperation = 'copy'; x.drawImage(B2.c, 0, 0); x.globalCompositeOperation = 'saturation'; x.fillStyle = '#808080'; x.fillRect(0, 0, 270, 480);
  x = B2.x; x.globalCompositeOperation = 'difference'; x.drawImage(G2.c, 0, 0);
  x.globalCompositeOperation = 'color'; x.fillStyle = YEL; x.fillRect(0, 0, 270, 480);
  x.globalCompositeOperation = 'lighter'; x.drawImage(B2.c, 0, 0); x.drawImage(B2.c, 0, 0);
  x = B3.x; x.globalCompositeOperation = 'copy'; x.drawImage(B2.c, 0, 0, 135, 240);
  x = B4.x; x.globalCompositeOperation = 'copy'; x.drawImage(B3.c, 0, 0, 68, 120);
  x = B5.x; x.globalCompositeOperation = 'copy'; x.drawImage(B4.c, 0, 0, 34, 60);
  x = U4.x; x.globalCompositeOperation = 'copy'; x.globalAlpha = 1; x.drawImage(B5.c, 0, 0, 68, 120); x.globalCompositeOperation = 'lighten'; x.globalAlpha = 0.8; x.drawImage(B4.c, 0, 0);
  x = U3.x; x.globalCompositeOperation = 'copy'; x.globalAlpha = 1; x.drawImage(U4.c, 0, 0, 135, 240); x.globalCompositeOperation = 'lighten'; x.globalAlpha = 0.7; x.drawImage(B3.c, 0, 0);
  x = U2.x; x.globalCompositeOperation = 'copy'; x.globalAlpha = 1; x.drawImage(U3.c, 0, 0, 270, 480); x.globalCompositeOperation = 'lighten'; x.globalAlpha = 0.42; x.drawImage(B2.c, 0, 0);
  c.globalCompositeOperation = 'lighten'; c.globalAlpha = GLOW; c.drawImage(U2.c, 0, 0, W, H);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  for (const f of INK) { c.save(); f(); c.restore(); }      // tinta negra por encima del halo
  INK.length = 0; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;

  c.drawImage(A.vig.c, 0, 0);
  // grano leve, a 30 fps
  const n = Math.floor(grainT * 30), ox = Math.floor(hash(n * 1.3) * 512), oy = Math.floor(hash(n * 2.9 + 5) * 512);
  c.translate(-ox, -oy); c.fillStyle = A.grain[n % 3]; c.fillRect(ox, oy, W, H); c.setTransform(1, 0, 0, 1, 0, 0);
}

/* ══════════ 10 · RENDER: un frame = una función del tiempo ══════════ */
function render(t, grainT = t) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  const cam = camera(t);
  c.save(); c.translate(cam.sx, cam.sy);
  bgGrid(c, t, cam);
  c.translate(cam.x, cam.y);                                 // «mundo»: todo el contenido flota con la cámara
  if (t < T.CHAOS) sceneHook(c, t, cam);
  if (t >= T.CHAOS - 0.05 && t < T.SNAP) sceneChaos(c, t);
  if (t >= T.SNAP && t < PH.t0) sceneCards(c, t);
  if (t >= PH.t0 && t < T.CAR) scenePhone(c, t);
  if (t >= T.PROD - 0.12 && t < T.CAR + 0.2) scenePlates(c, t);
  if (t >= T.CAR && t < T.BAR + 0.75) sceneCar(c, t, cam);
  if (t >= T.BAR + 0.75) drawBar(c, t);
  if (t >= T.LOGO - 0.1) sceneOutro(c, t);
  c.restore();
  post(c, t, grainT);
}

/* ══════════ 11 · INICIO ══════════ */
function init() {
  M.font = FD(200); const mh = M.measureText('H'); CAP = (mh.actualBoundingBoxAscent || 140) / 200;
  HOOK.size = 120 / CAP;                                      // mayúsculas de 120 px = una celda de la grilla
  let fs = 132; while (Math.max(...PROD.plates.flatMap(p => p.lines).map(s => tw(s, FD(fs)))) > 944) fs--; PROD.size = fs;
  fs = 156; while (Math.max(...PLATES.flatMap(p => p.lines).map(s => tw(s, FD(fs)))) > 760) fs--; STK.size = fs;
  WM = wmGeom(240 / CAP);                                     // mayúsculas de 240 px = dos celdas: de la línea 660 a la 900
  fs = 100; while (tw(CTA.txt, FD(fs)) > (WM.inkR - WM.inkL) - 84) fs--; CTA.size = fs;
  A.wmS = wmGeom(62);
  A.cards = EVENTS.map(sprCard); A.cardInk = EVENTS.map(sprCardInk); A.map = sprMap(); A.car = sprCar(); A.carSoft = sprCar(true);
  buildChaos(); buildPost();
}

/* ══════════ 12 · REPRODUCTOR ══════════ */
const $ = id => document.getElementById(id);
const SCENES = [[0, 'HOOK'], [T.CHAOS, 'PROBLEMA'], [T.SNAP, 'SNAP'], [T.PROD, 'PRODUCTO'], [T.CAR, 'TRANSICIÓN'], [T.LOGO, 'CIERRE']];
const P = { t: 0, playing: false, start: 0, ended: false, hud: false };
let peekTimer = 0, recorder = null;
const PTR = { x: 0, y: 0, x0: 0, y0: 0, quiet: 0 };          // puntero: para que un temblor del mouse no destape los botones al grabar

function setPlaying(v) { P.playing = v; document.body.classList.toggle('playing', v); }
function play(from = 0, preroll = 0.35) {                   // preroll: un instante de negro para arrancar la grabación limpio
  P.ended = false; P.t = from; P.start = performance.now() + preroll * 1000 - from * 1000; setPlaying(true); document.body.classList.remove('peek');
  PTR.x0 = PTR.x; PTR.y0 = PTR.y; PTR.quiet = performance.now() + 1500;
}
function pause() { if (P.playing) setPlaying(false); else if (!P.ended) { P.start = performance.now() - P.t * 1000; setPlaying(true); } else play(); }
function seek(t) { setPlaying(false); P.ended = false; P.t = clamp(t, 0, DUR); render(P.t); hud(); }
function hud() {
  if (!P.hud) return;
  const t = P.t, beat = Math.floor(t / BEAT + 1e-6), sc = SCENES.filter(s => t >= s[0]).pop()[1], on = (t / BEAT) % 1 < 0.2;
  const el = $('hud'); el.classList.toggle('on', on);
  el.innerHTML = `<b>${t.toFixed(3).padStart(6, '0')} s</b>  f ${String(Math.round(t * FPS)).padStart(4, '0')}\ncompás <b>${Math.floor(beat / 4) + 1}.${beat % 4 + 1}</b>  negra ${beat + 1}  ${BPM} BPM\n${sc}`;
}
let lastKey = '';
function loop(now) {
  if (P.playing) {
    P.t = Math.max(0, (now - P.start) / 1000);
    if (P.t >= DUR) { P.t = DUR; P.ended = true; setPlaying(false); if (recorder) setTimeout(() => recorder && recorder.state === 'recording' && recorder.stop(), 350); }
  }
  const gt = P.playing || P.ended ? now / 1000 : P.t;          // el grano sigue vivo sobre el último frame
  const key = P.t + '|' + Math.floor(gt * 30);
  if (key !== lastKey) { lastKey = key; render(P.t, gt); hud(); }   // en pausa no se redibuja; al terminar, sólo a 30 fps
  requestAnimationFrame(loop);
}

/* Grabación directa del lienzo: sale a 1080×1920 reales aunque la ventana sea más chica. */
function record() {
  if (recorder || !cv.captureStream || !window.MediaRecorder) return;
  const mime = ['video/mp4;codecs=avc1.64002A', 'video/mp4', 'video/webm;codecs=h264', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) return;
  const chunks = [], stream = cv.captureStream(FPS);
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24e6 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime.split(';')[0] }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'gridd-reel.' + (mime.includes('mp4') ? 'mp4' : 'webm'); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); stream.getTracks().forEach(tr => tr.stop()); recorder = null; $('recdot').hidden = true;
  };
  $('recdot').hidden = false; recorder.start(); play(0, 0.5);
}

function boot() {
  init();
  $('replay').addEventListener('click', () => play());
  $('rec').addEventListener('click', record);
  if (!cv.captureStream || !window.MediaRecorder) $('rec').hidden = true;
  // Mientras corre, los botones sólo vuelven si llevás el mouse a la franja de abajo (o tocás la pantalla):
  // así un movimiento mínimo al apretar Replay no los deja a la vista en la grabación.
  const peek = () => { document.body.classList.add('peek'); clearTimeout(peekTimer); peekTimer = setTimeout(() => document.body.classList.remove('peek'), 1400); };
  addEventListener('mousemove', e => {
    PTR.x = e.clientX; PTR.y = e.clientY;
    if (performance.now() < PTR.quiet && Math.hypot(PTR.x - PTR.x0, PTR.y - PTR.y0) < 60) return;
    if (e.clientY > innerHeight * 0.74) peek();
  });
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') peek(); });
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;          // no pisar atajos del navegador
    const k = e.key.toLowerCase();
