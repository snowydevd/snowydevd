<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gridd — De NPC a car spotter</title>
<!--
  GRIDD · «De NPC a car spotter» · animación 2D de personajes, 9:16 para Reels / TikTok
  ────────────────────────────────────────────────────────────────────────────────────────
  · Lienzo 1080×1920, pensado a 60 fps. Un solo archivo, sin dependencias: abrilo con doble clic.
  · La única voz es la del narrador. El guion está en la tabla VO (buscá «GUION»): cada línea trae
    su texto, su duración y cómo se parte en subtítulos. La línea de tiempo se arma sola a partir
    de esas duraciones: si regrabás una línea y dura distinto, cambiás su número y todo lo que
    viene después se corre solo.
  · Los subtítulos entran palabra por palabra al ritmo del guion: sirven de teleprompter para
    grabar la locución. «Cargar voz» toma un archivo de audio que arranca en el segundo 0, lo
    reproduce sincronizado y «Grabar video» lo incluye en el archivo que descarga.
  · Todo el dibujo es una función pura del tiempo → render(t): replay, pausa y avance cuadro a
    cuadro dan siempre exactamente el mismo frame.
  · Tipografías: Barlow Condensed 600 y 900 (SIL OFL 1.1), incrustadas al final del archivo.

  Controles:  R = replay · Espacio = pausa · ← → = cuadro a cuadro (Shift ×10)
              S = subtítulos sí/no · G = zonas seguras · B = guion en pantalla · H = ocultar botones
              F = pantalla completa
  Parámetros: ?t=12.5 (arranca pausado en ese segundo) · ?guides=1 · ?hud=1 · ?noui=1 · ?subs=0
-->
<style>
  :root { --bg:#0B0B0C; --y:#DFFF00; --k3:#1F1F23; --k5:#3C3C43; --k7:#84848E; --k9:#D6D6DA; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { font:500 12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--k7); -webkit-font-smoothing:antialiased; }

  /* escenario: siempre 9:16, lo más grande que entre en la ventana */
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  #box  { position:relative; height:min(100vh, calc(100vw * 16 / 9)); aspect-ratio:9 / 16; }
  @supports (height:100dvh) { #box { height:min(100dvh, calc(100vw * 16 / 9)); } }
  #stage { display:block; width:100%; height:100%; background:var(--bg); }
  body.playing:not(.peek) #box { cursor:none; }

  /* guías de zonas seguras de Reels (tecla G) */
  #guides { position:absolute; inset:0; pointer-events:none; }
  #guides i { position:absolute; left:0; right:0; display:flex; justify-content:center; font-style:normal;
              background:repeating-linear-gradient(135deg, rgba(223,255,0,.16) 0 2px, transparent 2px 12px); }
  #guides .top { top:0; height:15%; align-items:flex-end; border-bottom:1px dashed var(--y); }
  #guides .bot { bottom:0; height:20%; align-items:flex-start; border-top:1px dashed var(--y); }
  #guides b { margin:6px; padding:2px 8px; background:var(--y); color:var(--bg); font-weight:700; letter-spacing:.08em; }

  /* contador de beats (tecla B) */
  #hud { position:fixed; left:12px; top:12px; padding:8px 10px; background:rgba(11,11,12,.86); border:1px solid var(--k5);
         color:var(--k9); white-space:pre; pointer-events:none; }
  #hud b { color:var(--y); }
  #hud.on { border-color:var(--y); }

  /* botones: se esconden solos mientras corre, para que la grabación de pantalla salga limpia */
  #ui { position:fixed; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center;
        justify-content:center; flex-wrap:wrap; padding:0 16px; transition:opacity .18s ease; }
  body.playing:not(.peek) #ui, body.noui #ui { opacity:0; pointer-events:none; }
  button { all:unset; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px 0 14px; border-radius:20px; cursor:pointer;
           font:700 13px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.06em; text-transform:uppercase;
           background:var(--y); color:var(--bg); }
  button:hover { filter:brightness(1.06); }
  button:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--k9); outline-offset:3px; }
  button.ghost { background:rgba(11,11,12,.86); color:var(--k9); box-shadow:inset 0 0 0 1px var(--k5); }
  button.ghost:hover { box-shadow:inset 0 0 0 1px var(--y); }
  button svg { width:16px; height:16px; }
  #keys { flex-basis:100%; text-align:center; opacity:.9; text-shadow:0 0 6px var(--bg), 0 0 6px var(--bg); }
  #recdot { position:fixed; right:12px; top:12px; padding:6px 10px; color:var(--bg); background:var(--y); font-weight:700; letter-spacing:.08em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<div id="wrap"><div id="box">
  <canvas id="stage" width="1080" height="1920" role="img"
          aria-label="Animación de Gridd: un personaje sin un peso junta plata, se compra una cámara y termina publicando su propio evento de barridos."></canvas>
  <div id="guides" hidden><i class="top"><b>NO SEGURO · 15%</b></i><i class="bot"><b>NO SEGURO · 20%</b></i></div>
</div></div>

<div id="hud" hidden></div>
<div id="recdot" hidden>● GRABANDO</div>
<audio id="voz" preload="auto"></audio>
<input id="vozfile" type="file" accept="audio/*" hidden>

<div id="ui">
  <button id="replay" type="button" title="Volver a reproducir (R)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.6 1.8v2.9h-2.9"/></svg>
    Replay
  </button>
  <button id="rec" type="button" class="ghost" title="Graba el lienzo (y la voz, si hay) a 1080×1920 mientras se reproduce y descarga el archivo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg>
    Grabar video
  </button>
  <button id="vozbtn" type="button" class="ghost" title="Elegí un archivo de audio con la narración: se reproduce sincronizado desde el segundo 0">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v8M5 5v2M11 5v2M3 8a5 5 0 0 0 10 0M8 13v1.5"/></svg>
    <span id="vozlabel">Cargar voz</span>
  </button>
  <span id="keys">R replay · Espacio pausa · ← → cuadro a cuadro · S subtítulos · G zonas seguras · B guion · H ocultar · F pantalla completa</span>
</div>

<script>
(() => {
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════════════
   1 · FORMATO
   ══════════════════════════════════════════════════════════════════════════════════════ */
const W = 1080, H = 1920, FPS = 60, DT = 1 / FPS;
const qs = new URLSearchParams(location.search);
/* Reels: nada importante en el 15% de arriba ni en el 20% de abajo (zona segura: y 288→1536).
   Tres franjas fijas: subtítulos del narrador (300→540) · escena (560→1300) · indicadores (1340→1500). */
const GC = 120, GO = 60;                             // grilla base de 120 px con origen en (60,60)
const GYW = 1180;                                    // piso del mundo: ahí pisan los personajes

/* ══════════ 2 · PALETA (estricta: negro, amarillo flúo y grises intermedios) ══════════ */
const BG = '#0B0B0C', YEL = '#DFFF00';
const yel = a => `rgba(223,255,0,${a})`;
const K = { k2: '#17171A', k3: '#1F1F23', k4: '#2B2B30', k5: '#3C3C43', k6: '#5A5A63', k7: '#84848E', k8: '#ADADB6', k9: '#D6D6DA' };

/* ══════════ 3 · UTILIDADES ══════════ */
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const clamp = (v, a = 0, c = 1) => v < a ? a : v > c ? c : v;
const lerp = (a, c, u) => a + (c - a) * u;
const prog = (t, a, c) => clamp((t - a) / (c - a));          // avance 0→1 entre a y c

/* Easing con carácter: entradas rápidas con overshoot (outBack), salidas secas (inCubic/inQuart). Nada lineal. */
const E = {
  inQuad: x => x * x,
  inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inQuart: x => x * x * x * x, outQuart: x => 1 - Math.pow(1 - x, 4),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); };
const jit = (id, t, amp, hz = 15) => (hash(id * 13.37 + Math.floor(t * hz) * 7.13) * 2 - 1) * amp;   // temblor «en doses»
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d'), w, h }; };
function rr(c, x, y, w, h, r) {                      // rectángulo redondeado (path)
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function smooth(c, pts) {                            // curva suave por una lista de puntos
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  c.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}

/* ── tipografía ── */
const FAM = '"Barlow Condensed","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif';
const FD = s => `900 ${s}px ${FAM}`;                 // display: grotesca bold condensada
const FU = (s, w = 600) => `${w} ${s}px ${FAM}`;     // interfaz / textos chicos
const M = mk(4, 4).x;                                // contexto sólo para medir
const _tw = new Map(), _lay = new Map();
function tw(str, font) { const k = font + '|' + str; let v = _tw.get(k); if (v === undefined) { M.font = font; v = M.measureText(str).width; _tw.set(k, v); } return v; }
function lay(str, font) {                            // posición de cada letra respetando el kerning de la fuente
  const k = font + '|' + str; let L = _lay.get(k);
  if (!L) { const g = []; let prev = 0, wi = 0; for (let i = 0; i < str.length; i++) { const w = tw(str.slice(0, i + 1), font); if (str[i] === ' ') wi++; g.push({ ch: str[i], x: prev, w: w - prev, wi }); prev = w; } L = { g, w: prev }; _lay.set(k, L); }
  return L;
}
function tracked(c, str, x, y, tr, align = 'left') {  // texto con tracking manual (no depende de ctx.letterSpacing)
  const L = lay(str, c.font), w = L.w + tr * (str.length - 1);
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const ta = c.textAlign; c.textAlign = 'left';
  for (let i = 0; i < L.g.length; i++) c.fillText(L.g[i].ch, x0 + L.g[i].x + tr * i, y);
  c.textAlign = ta; return w;
}
let CAP = 0.7;                                       // altura de mayúscula / cuerpo (se mide al iniciar)

/* ══════════ 4 · LIENZOS ══════════ */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
const HB = mk(270, 480), HB2 = mk(270, 480);         // haces de luz: a un cuarto de resolución (son difusos, no se nota)
const B1 = mk(540, 960), B2 = mk(270, 480), G2 = mk(270, 480), B3 = mk(135, 240), B4 = mk(68, 120), B5 = mk(34, 60),
      U4 = mk(68, 120), U3 = mk(135, 240), U2 = mk(270, 480);   // pirámide del glow
const A = {};                                        // sprites pre-renderizados
/* Haces de luz con bordes suaves: degradé radial (distancia) × degradé cónico (ángulo), a 1/4 de resolución.
   Se mezclan con alpha normal (no aditivo) para que el punto más brillante nunca pase de #DFFF00.
   list = [[ox, oy, ángulo, semiapertura, largo], …] */
const HAS_CONIC = typeof ctx.createConicGradient === 'function';
function softBeams(c, list, alpha) {
  if (alpha <= 0.004) return;
  if (!HAS_CONIC) {                                  // navegadores viejos: conos simples
    for (const [ox, oy, ang, half, len] of list) { const g = c.createRadialGradient(ox, oy, 0, ox, oy, len); g.addColorStop(0, yel(alpha)); g.addColorStop(1, yel(0)); c.fillStyle = g; c.beginPath(); c.moveTo(ox, oy); c.arc(ox, oy, len, ang - half * 0.6, ang + half * 0.6); c.closePath(); c.fill(); }
    return;
  }
  const acc = HB2.x; acc.setTransform(1, 0, 0, 1, 0, 0); acc.globalCompositeOperation = 'source-over'; acc.clearRect(0, 0, 270, 480); acc.globalCompositeOperation = 'lighter';
  const k = a => `rgba(0,0,0,${a})`;
  for (const [ox, oy, ang, half, len] of list) {
    const x = HB.x; x.setTransform(0.25, 0, 0, 0.25, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H);
    const rg = x.createRadialGradient(ox, oy, 0, ox, oy, len);
    rg.addColorStop(0, yel(1)); rg.addColorStop(0.3, yel(0.7)); rg.addColorStop(0.65, yel(0.3)); rg.addColorStop(1, yel(0));
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'destination-in';
    const cg = x.createConicGradient(ang - Math.PI, ox, oy), hw = half / TAU;
    cg.addColorStop(0, k(0)); cg.addColorStop(0.5 - hw, k(0)); cg.addColorStop(0.5 - hw * 0.55, k(0.32)); cg.addColorStop(0.5 - hw * 0.22, k(0.85));
    cg.addColorStop(0.5, k(1)); cg.addColorStop(0.5 + hw * 0.22, k(0.85)); cg.addColorStop(0.5 + hw * 0.55, k(0.32)); cg.addColorStop(0.5 + hw, k(0)); cg.addColorStop(1, k(0));
    x.fillStyle = cg; x.fillRect(0, 0, W, H);
    acc.drawImage(HB.c, 0, 0);
  }
  const a0 = c.globalAlpha; c.globalAlpha = a0 * alpha; c.drawImage(HB2.c, 0, 0, W, H); c.globalAlpha = a0;
}
/* ══════════ 6 · KINETIC TYPOGRAPHY ══════════
   Texto que sube desde una máscara, por letra o por palabra, con overshoot al llegar y caída seca al salir. */
function riseText(c, str, x, base, size, color, t, tIn, tOut, o = {}) {
  const pre = o.pre ?? 0.09;                           // arranca un poco antes para que el «golpe» caiga en el beat
  if (t < tIn - pre || (tOut !== undefined && t > tOut + 0.3)) return;
  const font = FD(size), L = lay(str, font), byWord = !!o.byWord;
  const stg = o.stg ?? (byWord ? 0.07 : 0.018), dur = o.dur ?? 0.3, back = o.back ?? 1.5;
  c.save();
  c.beginPath(); c.rect(x - size * 0.25, base - size * 1.4, L.w + size * 0.5, size * 1.4 + size * 0.17); c.clip();
  c.font = font; c.fillStyle = color; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  for (let i = 0; i < L.g.length; i++) {
    const g = L.g[i]; if (g.ch === ' ') continue;
    const k = byWord ? g.wi : i, ti = tIn - pre + k * stg, p = prog(t, ti, ti + dur);
    if (p <= 0) continue;
    let dy = (1 - E.outBack(p, back)) * size * 1.08;
    if (tOut !== undefined) { const q = prog(t, tOut + k * (byWord ? 0.02 : 0.004), tOut + k * (byWord ? 0.02 : 0.004) + 0.09); if (q >= 1) continue; dy += E.inCubic(q) * size * 1.25; }
    if (p < 0.55) { const a0 = c.globalAlpha; c.globalAlpha = a0 * 0.3; c.fillText(g.ch, x + g.x, base + dy + (1 - p) * size * 0.3); c.globalAlpha = a0; }   // smear vertical
    c.fillText(g.ch, x + g.x, base + dy);
  }
  c.restore();
}

/* Tinta negra sobre amarillo (placas): se dibuja normal y se REDIBUJA después del glow,
   así el halo no la lava y el contraste queda pleno. */
const INK = [];
function ink(c, fn) { fn(); const m = c.getTransform(), a = c.globalAlpha; INK.push(() => { c.setTransform(m); c.globalAlpha = a; fn(); }); }

/* ══════════════════════════════════════════════════════════════════════════════════════
   2 · GUION Y LÍNEA DE TIEMPO
   ──────────────────────────────────────────────────────────────────────────────────────
   VO = lo que dice el narrador (la única voz). Para cada línea:
     d     duración de la locución en segundos (si regrabás, poné acá la duración real)
     say   el texto a leer
     pages cómo se muestra en subtítulos: cada página ≤ 6 palabras, «|» corta el renglón
           y *asteriscos* marcan lo que va en amarillo.
   SEGS = los tramos de la historia, en orden: [nombre, duración mínima, línea de voz, entrada, aire].
   La línea de tiempo se calcula sumando: un tramo dura lo que dura su voz (más entrada y aire)
   o su mínimo, lo que sea mayor. T.nombre = cuándo empieza · D.nombre = cuánto dura.
   Buscá «[VO]» y «[SFX]» en el código para ver dónde cae cada línea y cada efecto de sonido.
   ══════════════════════════════════════════════════════════════════════════════════════ */
const VO = {
  q1:      { d: 3.40, say: '¿Querés ser car spotter… y no tenés un mango?',            pages: ['¿QUERÉS SER|*CAR SPOTTER*…', '…Y NO TENÉS|*UN MANGO*?'] },
  q2:      { d: 2.30, say: 'Armate de valor… y agarrala.',                             pages: ['ARMATE DE VALOR…', '…Y *AGARRALA*.'] },
  job1:    { d: 0.90, say: 'Una changa.',                                              pages: ['UNA *CHANGA*.'] },
  job2:    { d: 0.95, say: 'Otra changa.',                                             pages: ['OTRA *CHANGA*.'] },
  job3:    { d: 0.90, say: 'Y otra más.',                                              pages: ['Y *OTRA MÁS*.'] },
  goal:    { d: 1.10, say: '¡Mil dólares!',                                            pages: ['¡*MIL DÓLARES*!'] },
  buy:     { d: 2.20, say: 'Te alcanza justo para la cámara.',                         pages: ['TE ALCANZA JUSTO|PARA *LA CÁMARA*.'] },
  q3:      { d: 3.00, say: '¿Y a qué auto le vas a sacar la primera foto?',            pages: ['¿Y A QUÉ AUTO', 'LE VAS A SACAR|*LA PRIMERA FOTO*?'] },
  nope:    { d: 1.60, say: 'Mmm… mejor no.',                                           pages: ['MMM…', '*MEJOR NO*.'] },
  gridd:   { d: 1.70, say: 'Tranqui. Usá Gridd.',                                      pages: ['TRANQUI.|USÁ *GRIDD*.'] },
  feed:    { d: 2.70, say: 'Todos los meets, en lista o en mapa.',                     pages: ['TODOS LOS MEETS,|EN *LISTA* O EN *MAPA*.'] },
  go:      { d: 3.10, say: 'Elegís uno, ves dónde y cuándo… y listo.',                 pages: ['ELEGÍS UNO, VES|*DÓNDE* Y *CUÁNDO*…', '…Y *LISTO*.'] },
  crowd:   { d: 3.00, say: 'Pero ojo: ahí van todos los car spotters.',                pages: ['PERO OJO:', 'AHÍ VAN *TODOS*|LOS CAR SPOTTERS.'] },
  own:     { d: 5.20, say: 'Así que armá el tuyo: publicá tu propio evento de barridos. Gratis.', pages: ['ASÍ QUE|*ARMÁ EL TUYO*:', 'PUBLICÁ TU PROPIO|EVENTO DE *BARRIDOS*.', '*GRATIS.*'] },
  form:    { d: 3.30, say: 'Elegís ubicación, horario y subís un flyer.',              pages: ['ELEGÍS *UBICACIÓN*,', '*HORARIO*…', 'Y SUBÍS *UN FLYER*.'] },
  stories: { d: 5.40, say: 'Sale en la app… y todos los días en las historias de Instagram de Gridd.', pages: ['SALE EN *LA APP*…', '…Y *TODOS LOS DÍAS*', 'EN LAS HISTORIAS DE|INSTAGRAM DE *GRIDD*.'] },
  rambla:  { d: 2.60, say: 'Y ahora… los autos vienen a vos.',                         pages: ['Y AHORA…', 'LOS AUTOS|*VIENEN A VOS*.'] },
  logo:    { d: 2.00, say: 'Gridd. Sumate a la beta.',                                 pages: [] },
};
/*__VO_DUR__*/                                       // (el armado puede pisar acá las duraciones medidas del audio)

const SEGS = [
  // nombre     mín.   voz        entrada  aire   corte (al terminar el tramo hay cambio de escena: el subtítulo se va antes)
  ['spawn',     1.40],                               // 1 · LA NADA: aparece el NPC en el medio de la grilla vacía
  ['q1',        0,     'q1',      0.08,    0.30],
  ['nod',       1.10],                               //     asiente
  ['fall',      1.10],                               // 2 · LA PALA: cae de arriba
  ['q2',        0,     'q2',      0.10,    0.25],
  ['grab',      0.85],                               //     la agarra
  ['job1',      1.45,  'job1',    0.20,    0.10,  true],    //     changa 1: obra
  ['job2',      1.45,  'job2',    0.20,    0.10,  true],    //     changa 2: lavadero
  ['job3',      1.45,  'job3',    0.20,    0.10,  true],    //     changa 3: delivery
  ['goal',      1.60,  'goal',    0.25,    0.20,  true],    //     meta: US$ 1.000
  ['buy',       2.60,  'buy',     0.35,    0.20],    // 3 · LA CÁMARA

  const step = (name, a, b) => lerp(a, b, E.outCubic(prog(t, T[name] + D[name] * 0.58, T[name] + D[name] * 0.92)));
  if (t < T.job2) return step('job1', 0, 300);

const $ = id => document.getElementById(id);

let peekTimer = 0, recorder = null, vozTimer = 0;

/* Voz del narrador: un archivo de audio que arranca en el segundo 0. Puede venir incrustado (VOZ_SRC)
   o cargarse con el botón «Cargar voz». La animación manda: el audio se le sincroniza. */
const VOZ_SRC = '/*__VOZ__*/';
const AU = { el: null, has: false };
function vozPlay(from, delay = 0) {
  clearTimeout(vozTimer); if (!AU.has) return;
  AU.el.pause();
  vozTimer = setTimeout(() => { try { AU.el.currentTime = Math.max(0, from); const pr = AU.el.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} }, delay * 1000);
}
function vozStop() { clearTimeout(vozTimer); if (AU.has) AU.el.pause(); }

function setPlaying(v) { P.playing = v; document.body.classList.toggle('playing', v); }
function play(from = 0, preroll = 0.35) {                   // preroll: un instante de negro para arrancar la grabación limpio
  P.ended = false; P.t = from; P.start = performance.now() + preroll * 1000 - from * 1000; setPlaying(true); document.body.classList.remove('peek');
  PTR.x0 = PTR.x; PTR.y0 = PTR.y; PTR.quiet = performance.now() + 1500;
  vozPlay(from, preroll);
}
function pause() {
  if (P.playing) { setPlaying(false); vozStop(); }

  else play();
}
function seek(t) { setPlaying(false); vozStop(); P.ended = false; P.t = clamp(t, 0, DUR); if (AU.has) { try { AU.el.currentTime = P.t; } catch (e) {} } render(P.t); hud(); }
function hud() {                                             // tecla B: en qué tramo estamos y qué dice el narrador
  if (!P.hud) return;
  const t = P.t; let sg = SEGS[0][0]; for (const s of SEGS) if (t >= T[s[0]]) sg = s[0];
  let line = '—'; for (const k in VO) if (t >= VO[k].t && t < VO[k].t + VO[k].d) line = VO[k].say;
  const el = $('hud'); el.classList.toggle('on', line !== '—');
  el.innerHTML = `<b>${t.toFixed(3).padStart(6, '0')} s</b> / ${DUR.toFixed(2)}  f ${String(Math.round(t * FPS)).padStart(4, '0')}\ntramo <b>${sg}</b>  (+${(t - T[sg]).toFixed(2)} s)\nvoz: ${line}`;
}
let lastKey = '';
function loop(now) {
  if (P.playing) {
